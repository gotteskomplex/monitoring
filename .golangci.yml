version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G104 # covered by errcheck
    revive:
      rules:
        - name: exported
          disabled: true
    misspell:
      locale: US
  exclusions:
    generated: strict
    paths:
      - internal/gen
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gotteskomplex/monitoring
  exclusions:
    paths:
      - internal/gen
