syntax = "proto3";

package monitoring.satellite.v1;

import "google/protobuf/timestamp.proto";

// Status is the evaluated state of a single check execution.
// The numeric values are persisted in the master database (check_results.status);
// never renumber them.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_WARNING = 2;
  STATUS_CRITICAL = 3;
  STATUS_UNKNOWN = 4;
}

// Metric is one measured value of a check execution (e.g. rtt=12.3 ms).
message Metric {
  // Stable metric name, lower_snake_case (e.g. "rtt_avg", "packet_loss").
  string name = 1;
  double value = 2;
  // Unit symbol, e.g. "ms", "%", "B", "B/s". Empty for dimensionless values.
  string unit = 3;
}

// CheckResult is the outcome of one check execution on a satellite.
message CheckResult {
  // ULID generated by the satellite; used by the master for idempotent ingest.
  bytes result_id = 1;
  string check_id = 2;
  // Config version the check definition was taken from.
  int64 config_version = 3;
  google.protobuf.Timestamp executed_at = 4;
  uint32 duration_ms = 5;
  Status status = 6;
  // Human readable output, truncated to 1 KiB by the satellite.
  string message = 7;
  // Attempt counter (1 = first attempt, >1 = retry after a non-OK result).
  uint32 attempt = 8;
  repeated Metric metrics = 9;
}
